name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l *.go)"
      - run: sh -n install.sh && sh -n scripts/release.sh
